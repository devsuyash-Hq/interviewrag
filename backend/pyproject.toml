[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "devsuyash-Hq", email = "sarpalesuyash9@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.2",
    "google-genai>=3.5.0",
    "mcp[cli]<2",
    "numpy>=2.5.5",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
